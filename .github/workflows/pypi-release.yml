# PyPI-only wheel release for the Enforce grammar (fork).
# Grammar © simonvic (MIT, https://github.com/simonvic/tree-sitter-enforce);
# this fork exists solely to publish prebuilt wheels to PyPI so enforce-cpg
# (and anyone) can `pip install tree-sitter-enforce` without a compiler.
name: pypi-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  wheels:
    name: wheels-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # arm64 mac; Intel mac -> sdist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_SKIP: "*-musllinux*"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}  # only tag pushes reach here; dispatch = build-only dry run
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
