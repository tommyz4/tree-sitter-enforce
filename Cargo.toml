[package]
name = "tree-sitter-enforce"
description = "Enforce Script"
version = "0.4.0"
authors = ["simonvic <simonvic.dev@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "enforce"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/simonvic/tree-sitter-enforce"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
